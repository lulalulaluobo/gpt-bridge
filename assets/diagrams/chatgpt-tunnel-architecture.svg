<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT Tunnel 主要组件关系</title>
  <desc id="desc">ChatGPT 的工具请求经过 OpenAI Tunnel 到达本机 tunnel-client，由 gpt-bridge 检查文件权限，再交给本机 MCP 工具；执行结果沿原路返回。桌面应用负责管理连接和访问权限。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#3977aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="returnArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#8862a4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <style>
      .ink{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#263746}
      .title{font-size:36px;font-weight:750}.subtitle{font-size:19px;fill:#50677a}
      .zone{font-size:18px;font-weight:700;letter-spacing:.3px;fill:#547383}
      .box{stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;filter:url(#pencil)}
      .nodeTitle{font-size:21px;font-weight:700}.nodeBody{font-size:17px;fill:#50677a}
      .flow{fill:none;stroke:#3977aa;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .back{fill:none;stroke:#8862a4;stroke-width:3;stroke-dasharray:10 9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#returnArrow)}
      .control{fill:none;stroke:#82929a;stroke-width:2.3;stroke-dasharray:5 7;stroke-linecap:round;marker-end:url(#returnArrow)}
    </style>
  </defs>
  <rect width="1440" height="700" rx="28" fill="#fffdf8"/>
  <text class="ink title" x="58" y="70">ChatGPT Tunnel：请求如何到达本机</text>
  <text class="ink subtitle" x="60" y="106">ChatGPT 发起调用，本机检查并执行，再把结果送回去。</text>
  <path d="M48 128 Q350 121 690 129 T1392 127" fill="none" stroke="#ded8cb" stroke-width="1.5"/>

  <!-- Cloud and local machine zones -->
  <path class="box" d="M38 157 Q245 149 455 158 L454 480 Q248 488 39 478 Z" fill="#f2f7fc" stroke="#7298b9" stroke-dasharray="10 9"/>
  <text class="ink zone" x="66" y="193">云端</text>
  <path class="box" d="M474 157 Q932 150 1398 158 L1397 620 Q930 628 475 619 Z" fill="#f2f8f3" stroke="#7da18b" stroke-dasharray="10 9"/>
  <text class="ink zone" x="506" y="193">你的 Mac / Windows</text>

  <!-- gpt-bridge desktop app manages the connection and policy -->
  <path class="box" d="M516 211 Q722 205 929 212 L928 284 Q721 290 516 283 Z" fill="#ffffff" stroke="#9aa8a9"/>
  <circle cx="553" cy="247" r="20" fill="#e8edf0" stroke="#84959b" stroke-width="2"/>
  <path d="M541 247 L565 247 M553 235 L553 259 M545 239 L561 255 M561 239 L545 255" fill="none" stroke="#62757b" stroke-width="2.2" stroke-linecap="round"/>
  <text class="ink nodeTitle" x="588" y="245">gpt-bridge 桌面应用</text>
  <text class="ink nodeBody" x="588" y="271">管理连接 · 设置访问权限</text>

  <!-- Main request path -->
  <path class="box" d="M69 309 Q148 302 230 310 L229 459 Q148 465 69 458 Z" fill="#ffffff" stroke="#73a5c8"/>
  <circle cx="149" cy="350" r="23" fill="#e4f1fb" stroke="#73a5c8" stroke-width="2"/>
  <path d="M136 349 Q141 340 149 347 L154 353 Q159 359 166 352 M163 358 Q158 366 150 359 L145 353 Q140 347 134 354" fill="none" stroke="#3977aa" stroke-width="2.5" stroke-linecap="round"/>
  <text class="ink nodeTitle" text-anchor="middle" x="149" y="402">ChatGPT</text>
  <text class="ink nodeBody" text-anchor="middle" x="149" y="431">发起工具请求</text>

  <path class="box" d="M270 309 Q355 302 440 310 L439 459 Q355 465 270 458 Z" fill="#fff4df" stroke="#d7a453"/>
  <path d="M318 352 C312 339 322 327 335 328 C341 313 363 315 368 328 C386 324 398 338 392 352 C408 357 404 376 390 379 L330 379 C312 378 305 361 318 352 Z" fill="#fffaf0" stroke="#c59043" stroke-width="2.2" stroke-linejoin="round"/>
  <text class="ink nodeTitle" text-anchor="middle" x="355" y="412">OpenAI Tunnel</text>
  <text class="ink nodeBody" text-anchor="middle" x="355" y="439">云端中继</text>

  <path class="box" d="M500 329 Q585 322 670 330 L669 469 Q585 475 500 468 Z" fill="#eaf4fc" stroke="#7298b9"/>
  <circle cx="585" cy="369" r="22" fill="#dcecf8" stroke="#73a5c8" stroke-width="2"/>
  <path d="M585 355 L585 383 M571 369 L599 369 M575 359 L595 379 M595 359 L575 379" fill="none" stroke="#3977aa" stroke-width="2.2" stroke-linecap="round"/>
  <text class="ink nodeTitle" text-anchor="middle" x="585" y="421">tunnel-client</text>
  <text class="ink nodeBody" text-anchor="middle" x="585" y="448">本机接入隧道</text>

  <path class="box" d="M710 329 Q795 322 880 330 L879 469 Q795 475 710 468 Z" fill="#eef0fb" stroke="#9084b7"/>
  <path d="M795 348 L816 360 L816 381 Q815 397 795 407 Q775 397 774 381 L774 360 Z" fill="#e2def4" stroke="#8476ae" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M785 379 L792 386 L805 371" fill="none" stroke="#725e9c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="ink nodeTitle" text-anchor="middle" x="795" y="433">gpt-bridge</text>
  <text class="ink nodeBody" text-anchor="middle" x="795" y="458">检查文件权限</text>

  <path class="box" d="M920 329 Q1005 322 1090 330 L1089 469 Q1005 475 920 468 Z" fill="#fff3e4" stroke="#cc9863"/>
  <path d="M981 353 L1001 353 L1009 361 L1027 361 Q1032 362 1032 368 L1032 389 Q1031 395 1025 395 L982 395 Q977 394 977 389 L977 358 Q977 353 981 353 Z" fill="#f9dfbf" stroke="#be874e" stroke-width="2.2" stroke-linejoin="round"/>
  <text class="ink nodeTitle" text-anchor="middle" x="1005" y="433">本机工具</text>
  <text class="ink nodeBody" text-anchor="middle" x="1005" y="458">执行 MCP 调用</text>

  <path class="box" d="M1130 329 Q1215 322 1300 330 L1299 469 Q1215 475 1130 468 Z" fill="#eef7e9" stroke="#82a66c"/>
  <path d="M1188 355 Q1202 351 1216 355 L1216 382 Q1202 386 1188 382 Z M1216 355 Q1230 351 1244 355 L1244 382 Q1230 386 1216 382 Z M1188 365 L1244 365" fill="#d9edcd" stroke="#71945e" stroke-width="2" stroke-linejoin="round"/>
  <text class="ink nodeTitle" text-anchor="middle" x="1215" y="423">授权文件夹</text>
  <text class="ink nodeBody" text-anchor="middle" x="1215" y="450">读取 / 写入</text>

  <!-- Request arrows -->
  <path class="flow" d="M233 384 C246 381 255 381 266 384"/>
  <path class="flow" d="M443 384 C462 381 478 381 496 384"/>
  <path class="flow" d="M673 399 C685 396 695 396 706 399"/>
  <path class="flow" d="M883 399 C895 396 905 396 916 399"/>
  <path class="flow" d="M1093 399 C1105 396 1115 396 1126 399"/>

  <!-- Desktop app configures tunnel-client and the local permission proxy -->
  <path class="control" d="M585 289 C585 302 585 312 585 325"/>
  <path class="control" d="M795 289 C795 302 795 312 795 325"/>

  <!-- Results travel back along the same tunnel -->
  <path class="back" d="M1215 471 C1215 520 1010 531 742 531 C480 531 270 524 149 480 L149 464"/>
  <rect x="570" y="512" width="330" height="38" rx="19" fill="#fffdf8"/>
  <text class="ink nodeBody" text-anchor="middle" x="735" y="538" fill="#75558f">执行结果沿原路返回</text>

  <rect x="60" y="630" width="1320" height="38" rx="19" fill="#f5f1e8"/>
  <text class="ink nodeBody" text-anchor="middle" x="720" y="655">本机主动建立加密连接 · 无需开放本机端口</text>
</svg>
